# Optional identity for a separately deployed operator; inference receives no cluster token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-reader
  namespace: mlops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-reader
  namespace: mlops-agent
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-reader
  namespace: mlops-agent
subjects:
  - kind: ServiceAccount
    name: mlops-reader
    namespace: mlops-agent
roleRef:
  kind: Role
  name: mlops-reader
  apiGroup: rbac.authorization.k8s.io
