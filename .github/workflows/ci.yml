name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q --junitxml=artifacts/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m training.generate_data
      - run: dvc root || dvc init
      - run: dvc add data/iris.csv
      - name: Record reproducible dataset reference
        run: |
          git config user.name "CI"
          git config user.email "ci@example.invalid"
          git add .dvc data/iris.csv.dvc .dvcignore
          git diff --cached --quiet || git commit -m "Record CI dataset"
      - name: Train against a local MLflow store
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: dvc repro
      - run: docker build -t mlops-iris:ci .
      - name: Smoke test actual inference container
        run: |
          docker run -d --name iris -p 8000:8000 mlops-iris:ci
          for i in $(seq 1 40); do curl -fsS http://localhost:8000/health/ready && break; sleep 2; done
          curl -fsS http://localhost:8000/health/ready
          curl -fsS -H 'Content-Type: application/json' -d '{"instances":[[5.1,3.5,1.4,0.2]]}' http://localhost:8000/predict
