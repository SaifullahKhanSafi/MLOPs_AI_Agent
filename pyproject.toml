[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-ai-agent"
version = "1.0.0"
description = "Evidence-driven MLOps agent with DVC, MLflow, Airflow 3 and Kubernetes"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "httpx==0.28.1",
  "pydantic==2.11.7", "pydantic-settings==2.10.1", "python-dotenv==1.1.1",
  "mlflow==3.1.4", "scikit-learn==1.7.2", "pandas==2.3.3",
  "numpy==2.2.6", "joblib==1.5.2", "dvc==3.63.0", "PyYAML==6.0.2",
  "pathspec==0.12.1", "SQLAlchemy==2.0.43", "dill==0.3.1.1"
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.9"]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
